{% extends 'base.html' %}
{% block title %}守护 - Resilio 面板{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">守护状态</h4>
  <div class="text-muted small">
    <span id="guard-state" class="me-2"></span>
    <button class="btn btn-sm btn-outline-secondary" id="guard-refresh">刷新</button>
  </div>
</div>

<div class="row g-3 mb-3">
  <div class="col-6 col-md-3">
    <div class="card shadow-sm"><div class="card-body py-2">
      <div class="text-muted small">OOM 重启次数</div>
      <div class="fs-4 fw-bold" id="g-nrestarts">-</div>
    </div></div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card shadow-sm"><div class="card-body py-2">
      <div class="text-muted small">最近备份</div>
      <div class="fs-6 fw-bold" id="g-last-backup">-</div>
    </div></div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card shadow-sm"><div class="card-body py-2">
      <div class="text-muted small">健康检查</div>
      <div class="fs-6" id="g-health">-</div>
    </div></div>
  </div>
  <div class="col-6 col-md-3">
    <div class="card shadow-sm"><div class="card-body py-2">
      <div class="text-muted small">调度模式</div>
      <div class="fs-4 fw-bold" id="g-sched-mode">-</div>
    </div></div>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <h6 class="card-title mb-3">调度器控制</h6>
    <div class="row g-2">
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">模式</label>
        <select class="form-select form-select-sm" id="sc-mode">
          <option value="off">off（禁用）</option>
          <option value="dry">dry（观察）</option>
          <option value="on">on（执行）</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">最大运行数</label>
        <input class="form-control form-control-sm" type="number" min="1" id="sc-max_running">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">做种上限</label>
        <input class="form-control form-control-sm" type="number" min="0" id="sc-seed_limit">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">恢复后最短保持(秒)</label>
        <input class="form-control form-control-sm" type="number" min="0" id="sc-run_min_stay">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">预热期(秒)</label>
        <input class="form-control form-control-sm" type="number" min="0" id="sc-preheat_sec">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">权重 w_need</label>
        <input class="form-control form-control-sm" type="number" step="0.1" id="sc-w_need">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">权重 w_scar</label>
        <input class="form-control form-control-sm" type="number" step="0.1" id="sc-w_scar">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">权重 w_speed</label>
        <input class="form-control form-control-sm" type="number" step="0.1" id="sc-w_speed">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">权重 w_download</label>
        <input class="form-control form-control-sm" type="number" step="0.1" id="sc-w_download">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">权重 w_time</label>
        <input class="form-control form-control-sm" type="number" step="0.1" id="sc-w_time">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">权重 w_wait</label>
        <input class="form-control form-control-sm" type="number" step="0.1" id="sc-w_wait">
      </div>
    </div>
    <hr class="my-3">
    <h6 class="card-title mb-3">安全模式</h6>
    <div class="row g-2">
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">触发阈值(窗口内次数, ≥2)</label>
        <input class="form-control form-control-sm" type="number" min="2" id="sc-safe_oom_threshold">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">统计窗口(秒)</label>
        <input class="form-control form-control-sm" type="number" min="60" id="sc-safe_oom_window">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">解除等待(秒, 无新OOM)</label>
        <input class="form-control form-control-sm" type="number" min="60" id="sc-safe_exit_quiet">
      </div>
      <div class="col-6 col-md-3 d-flex align-items-end">
        <span class="small text-muted">安全模式激活: <span id="g-safe-mode" class="badge bg-secondary">-</span></span>
      </div>
    </div>
    <hr class="my-3">
    <h6 class="card-title mb-3">冗余做种断开</h6>
    <div class="row g-2">
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">开关</label>
        <select class="form-select form-select-sm" id="sc-disconnect_seeded_on">
          <option value="0">关闭</option>
          <option value="1">开启</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">做种人数阈值(断开大于此值)</label>
        <input class="form-control form-control-sm" type="number" min="1" id="sc-disconnect_seeded_min">
      </div>
      <div class="col-6 col-md-3 d-flex align-items-end">
        <span class="small text-muted">断开后保留文件、可手动重连</span>
      </div>
    </div>
    <hr class="my-3">
    <h6 class="card-title mb-3">定期重连（断开文件夹复查）</h6>
    <div class="row g-2">
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">开关</label>
        <select class="form-select form-select-sm" id="sc-reconnect_on">
          <option value="0">关闭</option>
          <option value="1">开启</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">复查间隔(秒)</label>
        <input class="form-control form-control-sm" type="number" min="60" id="sc-reconnect_interval">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">退避上限(秒)</label>
        <input class="form-control form-control-sm" type="number" min="60" id="sc-reconnect_max_backoff">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">内存闸门(%)</label>
        <input class="form-control form-control-sm" type="number" min="1" max="99" id="sc-reconnect_mem_gate_pct">
      </div>
      <div class="col-6 col-md-3">
        <label class="form-label small text-muted">磁盘IO闸门(%)</label>
        <input class="form-control form-control-sm" type="number" min="1" max="99" id="sc-reconnect_io_gate_pct">
      </div>
      <div class="col-6 col-md-3 d-flex align-items-end">
        <span class="small text-muted">重连后交给冗余判定：需要就留着、冗余再断开</span>
      </div>
    </div>
    <button class="btn btn-primary btn-sm mt-3" id="sc-save">保存调度设置</button>
    <span id="sc-msg" class="ms-2 small"></span>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>window.PAGE = 'guard';</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>loadGuard(); startPolling('/api/guard/status', 15000);</script>
{% endblock %}
