{% extends 'base.html' %}
{% block title %}调度历史 - Resilio 面板{% endblock %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
  <h4 class="mb-0">调度历史</h4>
  <div class="d-flex align-items-center gap-3">
    <div class="form-check form-switch form-check-inline mb-0">
      <input class="form-check-input" type="checkbox" id="hist-show-summary">
      <label class="form-check-label small text-muted" for="hist-show-summary">显示周期汇总</label>
    </div>
    <select class="form-select form-select-sm" style="width:auto" id="hist-limit">
      <option value="50">显示 50 条</option>
      <option value="100">显示 100 条</option>
      <option value="2000">显示全部</option>
    </select>
    <a href="{{ url_for('sched') }}">← 返回调度判定</a>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
    <table class="table table-sm table-hover align-middle mb-0 table-fixed">
      <colgroup>
        <col style="width:13%"><col style="width:5%"><col style="width:7%"><col style="width:14%">
        <col style="width:6%"><col style="width:7%"><col style="width:7%"><col style="width:6%">
        <col style="width:9%"><col style="width:26%">
      </colgroup>
      <thead class="table-light">
        <tr>
          <th>时间</th><th>周期</th><th>动作</th><th>文件夹</th><th>分级</th>
          <th>需上传</th><th>待下载</th><th>做种</th><th>上传速度</th><th>备注</th>
        </tr>
      </thead>
      <tbody id="sched-history-body">
        <tr><td colspan="10" class="text-center text-muted py-4">加载中…</td></tr>
      </tbody>
    </table>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>window.PAGE = 'sched_history';</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>loadSchedHistoryDetail(); setInterval(loadSchedHistoryDetail, 30000);</script>
{% endblock %}
